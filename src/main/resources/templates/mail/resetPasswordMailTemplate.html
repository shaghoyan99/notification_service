<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
</head>
<body style="margin:0; padding:0; background:#f4f6f8; font-family:Arial,sans-serif;">

<table width="100%" cellpadding="0" cellspacing="0">
    <tr>
        <td align="center">

            <table width="600" style="background:#ffffff; margin-top:40px; padding:30px; border-radius:12px;">

                <tr>
                    <td align="center">
                        <h2 style="margin:0; color:#222;">Reset your password</h2>
                    </td>
                </tr>

                <tr>
                    <td style="padding:20px 0; color:#555; text-align:center;">
                        We received a request to reset your password.
                    </td>
                </tr>

                <tr>
                    <td align="center">
                        <div style="font-size:30px; font-weight:bold; color:#ef4444; letter-spacing:4px;">
                            <span th:text="${code}"></span>
                        </div>
                    </td>
                </tr>

                <tr>
                    <td align="center" style="padding:30px;">
                        <a th:href="${resetLink}"
                           style="background:#ef4444; color:#fff; padding:14px 28px;
                                  text-decoration:none; border-radius:8px;">
                            Reset Password
                        </a>
                    </td>
                </tr>

                <tr>
                    <td style="color:#999; font-size:12px; text-align:center;">
                        If you didn’t request this, secure your account.
                    </td>
                </tr>

            </table>

        </td>
    </tr>
</table>

</body>
</html>
