<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
</head>
<body style="margin:0; padding:0; background:#f4f6f8; font-family:Arial,sans-serif;">

<table cellpadding="0" cellspacing="0" width="100%">
    <tr>
        <td align="center">

            <table style="background:#ffffff; margin-top:40px; padding:30px; border-radius:12px;" width="600">

                <tr>
                    <td align="center">
                        <h1 style="margin:0; color:#111;">New Order Created 📦</h1>
                    </td>
                </tr>

                <tr>
                    <td style="padding:20px 0; color:#555; text-align:center;">
                        A new order has been successfully created.
                    </td>
                </tr>
                <tr>
                    <td align="center" style="padding:10px 0; color:#111;">
                        <strong>Product:</strong>
                        <span th:text="${productName}">Product Name</span>
                    </td>
                </tr>
                <tr>
                    <td align="center" style="padding:20px;">
                        <a style="background:#3b82f6; color:#fff; padding:14px 28px;
                                  text-decoration:none; border-radius:8px;"
                           th:href="${orderUrl}">
                            View Order
                        </a>
                    </td>
                </tr>
                <tr>
                    <td style="padding-top:20px; color:#777; text-align:center;">
                        You can track the order and communicate with participants anytime.
                    </td>
                </tr>

            </table>

        </td>
    </tr>
</table>

</body>
</html>
