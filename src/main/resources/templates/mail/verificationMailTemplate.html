<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
</head>
<body style="margin:0; padding:0; background:#f4f6f8; font-family:Arial,sans-serif;">

<table cellpadding="0" cellspacing="0" width="100%">
    <tr>
        <td align="center">

            <table style="background:#ffffff; margin-top:40px; padding:30px; border-radius:12px;" width="600">

                <tr>
                    <td align="center">
                        <h2 style="margin:0; color:#222;">Verify your email</h2>
                    </td>
                </tr>

                <tr>
                    <td style="padding:20px 0; color:#555; text-align:center;">
                        Thanks for joining! Please confirm your email address.
                    </td>
                </tr>

                <tr>
                    <td align="center">
                        <div style="font-size:32px; font-weight:bold; color:#4f46e5; letter-spacing:4px;">
                            <span th:text="${code}"></span>
                        </div>
                    </td>
                </tr>

                <tr>
                    <td align="center" style="padding:30px;">
                        <a style="background:#4f46e5; color:#fff; padding:14px 28px;
                                  text-decoration:none; border-radius:8px; display:inline-block;"
                           th:href="${verifyLink}">
                            Verify Email
                        </a>
                    </td>
                </tr>

                <tr>
                    <td style="color:#999; font-size:12px; text-align:center;">
                        If you didn’t request this, ignore this email.
                    </td>
                </tr>

            </table>

        </td>
    </tr>
</table>

</body>
</html>
